name: Subida Diaria a YouTube

on:
  # Ejecutar todos los días a las 10:00 AM (hora de España/Madrid = UTC+1/+2)
  # Para España en invierno (UTC+1): usar 09:00 UTC
  # Para España en verano  (UTC+2): usar 08:00 UTC
  schedule:
    - cron: "0 9 * * *"  # 10:00 AM hora España (invierno) / 11:00 AM (verano)

  # Permite ejecutar manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prueba sin subir realmente (dry run)"
        required: false
        default: "false"
        type: boolean

jobs:
  upload:
    name: Subir video del día
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para hacer commit de la cola actualizada

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar cola de videos
        run: |
          echo "--- Estado actual de la cola ---"
          python3 -c "
          import json
          with open('video_queue.json') as f:
              data = json.load(f)
          total = len(data['videos'])
          uploaded = sum(1 for v in data['videos'] if v.get('uploaded'))
          pending = total - uploaded
          print(f'Total: {total} | Subidos: {uploaded} | Pendientes: {pending}')
          if pending > 0:
              nxt = next(v for v in data['videos'] if not v.get('uploaded'))
              print(f'Siguiente: {nxt[\"title\"]}')
          else:
              print('AVISO: No quedan videos pendientes en la cola.')
          "

      - name: Subir video a YouTube
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 youtube_uploader.py

      - name: [DRY RUN] Simular subida
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN: Se haría la subida, pero no se ejecuta."

      - name: Guardar cola actualizada en el repositorio
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video_queue.json
          git diff --staged --quiet || git commit -m "chore: marcar video del día como subido [$(date '+%Y-%m-%d')]"
          git push
