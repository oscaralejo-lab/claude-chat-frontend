<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radio Render</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #bg {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(0.45) blur(2px);
      transform: scale(1.05);
    }

    #overlay {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 60px 80px;
      text-align: center;
    }

    #logo {
      font-size: 1rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #f59e0b;
      margin-bottom: 32px;
      opacity: 0.9;
    }

    #title {
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      font-weight: 700;
      line-height: 1.2;
      max-width: 900px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      margin-bottom: 20px;
    }

    #subtitle {
      font-size: clamp(1rem, 2vw, 1.5rem);
      font-weight: 400;
      color: #d1d5db;
      max-width: 700px;
      line-height: 1.5;
      text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }

    #waveform {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 48px;
    }

    #waveform span {
      display: block;
      width: 4px;
      border-radius: 2px;
      background: #f59e0b;
      animation: wave 1.2s ease-in-out infinite;
    }

    #waveform span:nth-child(1)  { height: 14px; animation-delay: 0.0s; }
    #waveform span:nth-child(2)  { height: 28px; animation-delay: 0.1s; }
    #waveform span:nth-child(3)  { height: 20px; animation-delay: 0.2s; }
    #waveform span:nth-child(4)  { height: 36px; animation-delay: 0.3s; }
    #waveform span:nth-child(5)  { height: 24px; animation-delay: 0.4s; }
    #waveform span:nth-child(6)  { height: 32px; animation-delay: 0.5s; }
    #waveform span:nth-child(7)  { height: 18px; animation-delay: 0.6s; }
    #waveform span:nth-child(8)  { height: 28px; animation-delay: 0.7s; }
    #waveform span:nth-child(9)  { height: 22px; animation-delay: 0.8s; }
    #waveform span:nth-child(10) { height: 14px; animation-delay: 0.9s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(1); opacity: 0.8; }
      50%       { transform: scaleY(1.8); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="overlay">
    <div id="logo">📻 News Radio 24/7</div>
    <div id="title"></div>
    <div id="subtitle"></div>
    <div id="waveform">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const audioSrc = params.get("audio") || "";
      const bgSrc    = params.get("bg")    || "";
      const title    = params.get("title") || "";
      const subtitle = params.get("subtitle") || "";

      if (bgSrc) {
        document.getElementById("bg").style.backgroundImage = `url('${bgSrc}')`;
      }
      document.getElementById("title").textContent    = title;
      document.getElementById("subtitle").textContent = subtitle;

      if (!audioSrc) {
        window.__renderDone = true;
        return;
      }

      const audio = new Audio(audioSrc);
      audio.addEventListener("ended", function () {
        window.__renderDone = true;
      });
      audio.addEventListener("error", function () {
        window.__renderDone = true;
      });
      audio.play().catch(function () {
        window.__renderDone = true;
      });
    })();
  </script>
</body>
</html>
