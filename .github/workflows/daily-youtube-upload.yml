name: Pipeline Diario — TechNoticias a YouTube

on:
  # Todos los días a las 09:00 UTC = 10:00 AM España (invierno) / 11:00 AM (verano)
  schedule:
    - cron: "0 9 * * *"

  # Ejecución manual desde la pestaña "Actions" de GitHub
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generar video SIN subir a YouTube (dry run)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  generate-and-upload:
    name: Generar video y subir a YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 60    # El video puede tardar ~10-15 min en generarse

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ── Sistema: ffmpeg y fuentes ────────────────────────────
      - name: Instalar ffmpeg y fuentes del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-liberation \
            fonts-dejavu-core

      # ── Python ───────────────────────────────────────────────
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      # ── Diagnóstico ──────────────────────────────────────────
      - name: Verificar entorno
        run: |
          echo "--- ffmpeg ---"
          ffmpeg -version | head -1
          echo "--- Python ---"
          python --version
          echo "--- Paquetes instalados ---"
          pip list | grep -E "moviepy|Pillow|anthropic|edge.tts|feedparser|google"

      # ── Pipeline principal ───────────────────────────────────
      - name: Ejecutar pipeline diario
        env:
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID:       ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:   ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:   ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python daily_pipeline.py --dry-run
          else
            python daily_pipeline.py
          fi

      # ── Guardar el video como artefacto (solo en dry-run) ────
      - name: Guardar video como artefacto
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-preview-${{ github.run_id }}
          path: /tmp/daily_tech_video.mp4
          retention-days: 3
