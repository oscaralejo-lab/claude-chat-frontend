<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Chat</title>
  <style>
    body { font-family: system-ui; margin: 0; background:#0f172a; color:#e5e7eb }
    header { padding: 14px; text-align: center; background:#020617; font-weight:600 }
    #chat { padding: 12px; height: calc(100vh - 120px); overflow:auto }
    .msg { margin-bottom: 14px; line-height:1.4 }
    .yo { color:#38bdf8 }
    .claude { color:#a7f3d0 }
    form { display:flex; gap:8px; padding:10px; background:#020617 }
    input { flex:1; padding:12px; border-radius:10px; border:none }
    button { padding:12px 16px; border-radius:10px; border:none; background:#38bdf8; font-weight:600 }
  </style>
</head>
<body>
  <header>💬 Claude Chat (Android)</header>
  <div id="chat"></div>

  <form id="form">
    <input id="input" placeholder="Escribe aquí…" autocomplete="off" />
    <button>Enviar</button>
  </form>

<script>
const BACKEND = "https://claude-chat-backend-r4o.onrender.com";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");

function add(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<b>${role}:</b> ${text}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = input.value.trim();
  if (!msg) return;
  input.value = "";

  add("yo", msg);
  const wait = add("claude", "…");

  try {
    const r = await fetch(BACKEND + "/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: msg })
    });
    const data = await r.json();
    wait.innerHTML = `<b>claude:</b> ${data.reply || ("Error: " + data.error)}`;
  } catch (err) {
    wait.innerHTML = `<b>claude:</b> Error de red`;
  }
});
</script>
</body>
</html>
